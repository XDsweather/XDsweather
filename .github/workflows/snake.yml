name: Generate Snake

on:
  schedule:
    # Har 6 soatda avtomatik ishga tushadi
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # 1. Kodni eng oxirgi v4 orqali yuklab olish
      - name: Checkout Repo
        uses: actions/checkout@v4

      # 2. Platane/snk v3 versiyasi orqali ilonchani generatsiya qilish
      - name: Generate Snake Animation
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#8a2be2

      # 3. Yaratilgan fayllarni 'output' branchiga xavfsiz push qilish
      - name: Deploy to Output Branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
